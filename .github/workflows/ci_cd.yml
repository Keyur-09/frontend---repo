name : ci_cd pipeline
on:
  push:
    branches: [ "**" ]

  workflow_dispatch:
    inputs:
      environment:
        description: 'target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      run_mode:
        description: "ci_only = lint/build only, ci_cd = build/push/deploy"    
        required: false
        default: "ci_only"
        type: choice
        options:
          - ci_only
          - ci_cd
      
      deploy_reason:
        description: "reason for deployment (optional)"
        required: false
        default: "manual-trigger"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    environment: >-
      ${{ 
        github.event_name == 'workflow_dispatch' && github.event.inputs.environment ||
        (github.ref == 'refs/heads/main' && 'production' || 'development') 
      }}

    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
      IMAGE_NAME: ${{ github.repository }}  
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set metadata
        id: meta
        run: |
          echo "run_mode=${{ github.event.inputs.run_mode || 'ci_only' }}" >> $GITHUB_OUTPUT  
      
      - name: Set Docker metadata
        id: docker_meta
        run: |
          if [[ "${{ github.event.inputs.run_mode }}" == "ci_cd" ]]; then
            echo "SHOULD_BUILD_AND_PUSH=true" >> $GITHUB_OUTPUT
            echo "FULL_IMAGE=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}" >> $GITHUB_OUTPUT
          else
          echo "SHOULD_BUILD_AND_PUSH=false" >> $GITHUB_OUTPUT
          fi    

 #----------------------ci_only (no docker)--------------------------
      - name: Set up Node.js
        if: steps.meta.outputs.run_mode == 'ci_only'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.meta.outputs.run_mode == 'ci_only'
        run: npm install --legacy-peer-deps
        
      - name: Build
        if: steps.meta.outputs.run_mode == 'ci_only'
        run: npm run build
        
#---------------------- docker build/push ------------------------------
      - name: Set up Docker Buildx
        if: steps.meta.outputs.SHOULD_BUILD_AND_PUSH == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.meta.outputs.SHOULD_BUILD_AND_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build image (scan only)
        if: steps.meta.outputs.SHOULD_BUILD_AND_PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
            context: .
            push: false
            load: true
            tags: scan-target:local
            build-args: |
                    NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
                    BUILD_DATE=${{ github.run_started_at }}
                    VCS_REF=${{ github.sha }}
                    CACHE_BUST=${{ github.run_id }}
            cache-from: type=gha
            cache-to: type=gha,mode=max 
            sbom: false
            provenance: false 

      - name: Trivy image scan
        if: steps.meta.outputs.SHOULD_BUILD_AND_PUSH == 'true'
        uses: aquasecurity/trivy-action@v0.35.0
        with:
            image-ref: scan-target:local
            format: table
            exit-code: "1"
            ignore-unfixed: true
            severity: CRITICAL    

      - name: Tag image 
        if: steps.meta.outputs.SHOULD_BUILD_AND_PUSH == 'true'
        run: |
              docker tag scan-target:local ${{ steps.meta.outputs.FULL_IMAGE }}
    
      - name: Push image
        if: steps.meta.outputs.SHOULD_BUILD_AND_PUSH == 'true'
        run: |
            docker push ${{ steps.meta.outputs.FULL_IMAGE }}

      - name: Tag as latest (main & develop)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && steps.meta.outputs.SHOULD_BUILD_AND_PUSH == 'true'
        run: |
          docker pull ${{ steps.meta.outputs.FULL_IMAGE }}
          docker tag ${{ steps.meta.outputs.FULL_IMAGE }} ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:latest
          docker push ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:latest

    